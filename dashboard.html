<!-- client/templates/dashboard.html -->
{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="card shadow">
    <div class="card-body">
        <h2 class="mb-4">User Dashboard</h2>
        <div class="d-grid gap-2">
            <a href="{{ url_for('voter_verify') }}" class="btn btn-primary btn-lg">
                <i class="bi bi-person-check"></i> Voter Verification
            </a>
            {% if current_user.is_admin %}
                <a href="{{ url_for('admin_verify') }}" class="btn btn-warning btn-lg">
                    <i class="bi bi-shield-lock"></i> Admin Panel
                </a>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
